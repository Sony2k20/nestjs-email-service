name: Build NestJS App and Docker Image

on:
  push:
    branches:
      - master

env:
  IMAGE: sony2k20/${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Determine image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker buildx build \
          --platform linux/arm64,linux/amd64 \
          --tag $IMAGE:latest \
          --tag $IMAGE:${{ steps.tag.outputs.tag }} \
          --push .

  update-deployment:
    runs-on: ubuntu-latest
    needs: build
    env:
      TAG: ${{ needs.build.outputs.tag }}
      # The email service is a source of the ng-web-portfolio Argo CD application
      FILE: app-of-apps/apps/ng-web-portfolio.yaml
    steps:
      - name: Clone gitops repository
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git clone --depth 1 https://${{ secrets.COMMIT_TO_REPO_TOKEN }}@github.com/Sony2k20/gitops-deployments.git target-repo

      - name: Set image tag
        working-directory: target-repo
        run: |
          # Drop the tag line right below the image repository (if any), then write the new one
          sed -i -E "\#^\s*repository: $IMAGE\s*\$#{n;/^\s*tag:/d}" "$FILE"
          sed -i -E "s#^(\s*)repository: $IMAGE\s*\$#&\n\1tag: \"$TAG\"#" "$FILE"
          grep -q "tag: \"$TAG\"" "$FILE"
          git --no-pager diff

      - name: Commit and push
        working-directory: target-repo
        run: |
          if git diff --quiet; then
            echo "Tag already set, nothing to do"
            exit 0
          fi
          git commit -am "Email-Service: Image-Tag auf $TAG"
          for i in 1 2 3; do
            git push origin HEAD:master && exit 0
            git pull --rebase origin master
          done
          exit 1
