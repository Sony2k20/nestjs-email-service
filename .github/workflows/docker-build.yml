name: Build NestJS App and Docker Image

on:
  push:
    branches:
      - master

# Releases must be numbered in order
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: sony2k20/${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Bump derived from the commits since the last tag (Conventional Commits):
      # "type!:" or "BREAKING CHANGE" -> major, "feat:" -> minor, anything else -> patch
      - name: Determine version
        id: version
        run: |
          existing=$(git tag --points-at HEAD --list 'v*.*.*' | sort -V | tail -1)
          if [ -n "$existing" ]; then
            echo "HEAD is already released as $existing"
            echo "version=${existing#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            version=$(node -p "require('./package.json').version")
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            log=$(git log "$last..HEAD" --format='%s%n%b')
            if grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING[ -]CHANGE' <<< "$log"; then
              version="$((major + 1)).0.0"
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then
              version="$major.$((minor + 1)).0"
            else
              version="$major.$minor.$((patch + 1))"
            fi
          fi
          echo "Last release: ${last:-none}, new version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
          --platform linux/arm64,linux/amd64 \
          --tag $IMAGE:$VERSION \
          --tag $IMAGE:${VERSION%.*} \
          --tag $IMAGE:${VERSION%%.*} \
          --tag $IMAGE:latest \
          --push .

      # Tag only after the image is pushed, so every tag has an image
      - name: Create git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes

  update-deployment:
    runs-on: ubuntu-latest
    needs: build
    env:
      TAG: ${{ needs.build.outputs.version }}
      # The email service is a source of the ng-web-portfolio Argo CD application
      FILE: app-of-apps/apps/ng-web-portfolio.yaml
    steps:
      - name: Clone gitops repository
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git clone --depth 1 https://${{ secrets.COMMIT_TO_REPO_TOKEN }}@github.com/Sony2k20/gitops-deployments.git target-repo

      - name: Set image tag
        working-directory: target-repo
        run: |
          # Drop the tag line right below the image repository (if any), then write the new one
          sed -i -E "\#^\s*repository: $IMAGE\s*\$#{n;/^\s*tag:/d}" "$FILE"
          sed -i -E "s#^(\s*)repository: $IMAGE\s*\$#&\n\1tag: \"$TAG\"#" "$FILE"
          grep -q "tag: \"$TAG\"" "$FILE"
          git --no-pager diff

      - name: Commit and push
        working-directory: target-repo
        run: |
          if git diff --quiet; then
            echo "Tag already set, nothing to do"
            exit 0
          fi
          git commit -am "Email-Service: Image-Tag auf $TAG"
          for i in 1 2 3; do
            git push origin HEAD:master && exit 0
            git pull --rebase origin master
          done
          exit 1
